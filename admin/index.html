<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        var mode = 'light';
        try {
          var raw = window.localStorage.getItem('theme-mode');
          var parsed = raw ? JSON.parse(raw) : null;
          var stored = parsed && parsed.state ? parsed.state.mode : null;
          if (stored === 'light' || stored === 'dark') mode = stored;
          else if (stored === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches) mode = 'dark';
        } catch (e) { /* fall back to light */ }
        document.documentElement.setAttribute('data-theme', mode);
        // Skin: the player-panel look is the default. localStorage 'admin-skin' = 'classic' brings back
        // the indigo look (tokens.css, "Player skin").
        try {
          if (window.localStorage.getItem('admin-skin') === 'classic') document.documentElement.setAttribute('data-skin', 'classic');
        } catch (e) { /* default skin */ }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GameDash - Risk Management Platform</title>
    <!-- Theme tokens and the admin kit own the application styles. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Roboto+Condensed:wght@300..900&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root" data-ui-radius="square"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
