# Nginx: longer timeouts for GET /dev/gmag-game-data?all=1
# This endpoint fetches ~125 pages from upstream GMag API and can take 1–2 minutes.
# Without these settings, nginx returns 502 Bad Gateway after default proxy_read_timeout (often 60s).
#
# Add this *inside* the location block that proxies to admin-backend, e.g.:
#
#   location /dev/gmag-game-data {
#     proxy_pass http://localhost:4002;   # or your admin-backend upstream
#     proxy_http_version 1.1;
#     proxy_set_header Host $host;
#     proxy_set_header X-Real-IP $remote_addr;
#     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#     proxy_set_header X-Forwarded-Proto $scheme;
#     proxy_connect_timeout 10s;
#     proxy_send_timeout 180s;
#     proxy_read_timeout 180s;
#   }
#
# Or, to apply only when query string contains all=1 (nginx 1.11.2+):
#
#   location = /dev/gmag-game-data {
#     if ($arg_all = "1") {
#       set $long_timeout 1;
#     }
#     proxy_pass http://localhost:4002;
#     proxy_http_version 1.1;
#     proxy_set_header Host $host;
#     proxy_set_header X-Real-IP $remote_addr;
#     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#     proxy_set_header X-Forwarded-Proto $scheme;
#     proxy_connect_timeout 10s;
#     proxy_send_timeout 180s;
#     proxy_read_timeout 180s;
#   }
#
# After editing, reload nginx: sudo nginx -t && sudo systemctl reload nginx

proxy_connect_timeout 10s;
proxy_send_timeout 180s;
proxy_read_timeout 180s;
