  # ---------------------------------------------------------------------------
  # CRM
  # ---------------------------------------------------------------------------

  """Signs a CRM user in. Resolves the whitelabel from the request host."""
  crmLogin(username: String!, password: String!): CrmLoginResult!
  """
  Changes the caller's own password.

  Ends every session the account has, this one included: the token version is
  bumped, so the caller is signed out and must sign in again with the new
  password. Re-authenticates against the current password first.
  """
  crmChangeOwnPassword(currentPassword: String!, newPassword: String!): CrmMutationResult!

  crmCreateUser(input: CrmCreateUserInput!): CrmMutationResult!
  crmUpdateUser(input: CrmUpdateUserInput!): CrmMutationResult!
  crmSetUserStatus(id: ID!, status: String!): CrmMutationResult!
  """Sets a new password and requires the user to change it on next sign-in."""
  crmResetUserPassword(id: ID!, newPassword: String!): CrmMutationResult!
  crmSetUserRoles(id: ID!, roleIds: [ID!]!): CrmMutationResult!
  crmDeleteUser(id: ID!): CrmMutationResult!

  crmCreateRole(name: String!, description: String, permissions: [CrmPermissionInput!]!): CrmMutationResult!
  crmUpdateRole(id: ID!, name: String, description: String, permissions: [CrmPermissionInput!]): CrmMutationResult!
  crmDeleteRole(id: ID!): CrmMutationResult!

  crmCreateBook(name: String!, description: String): CrmMutationResult!
  crmUpdateBook(id: ID!, name: String, description: String): CrmMutationResult!
  crmDeleteBook(id: ID!): CrmMutationResult!
  crmSetBookMembers(bookId: ID!, crmUserIds: [ID!]!): CrmMutationResult!

  """Moves players into a book. A player belongs to exactly one."""
  crmAssignPlayers(playerIds: [ID!]!, bookId: ID!, ownerId: ID): CrmMutationResult!
  crmUnassignPlayers(playerIds: [ID!]!): CrmMutationResult!

  crmAddIpAllowlistEntry(crmUserId: ID!, cidr: String!, label: String): CrmMutationResult!
  crmRemoveIpAllowlistEntry(id: ID!): CrmMutationResult!

  """
  CRM user management from the admin panel, for whoever owns the whitelabel
  rather than the desk.

  These exist because the CRM's own user management needs a working CRM login
  to reach, which is no help when there isn't one. A Super Admin names the
  whitelabel; a whitelabel administrator's `tenant` argument is overridden with
  their own. Deliberately outside the `crm` prefix, which is exempt from the
  guard that refuses CRM sessions on admin-panel fields.
  """
  whitelabelCrmCreateUser(tenant: ID, input: CrmCreateUserInput!): CrmMutationResult!
  whitelabelCrmUpdateUser(tenant: ID, input: CrmUpdateUserInput!): CrmMutationResult!
  whitelabelCrmSetUserStatus(tenant: ID, id: ID!, status: String!): CrmMutationResult!
  """Sets a new password and forces the holder to change it at next sign-in."""
  whitelabelCrmResetPassword(tenant: ID, id: ID!, newPassword: String!): CrmMutationResult!
  whitelabelCrmSetUserRoles(tenant: ID, id: ID!, roleIds: [ID!]!): CrmMutationResult!
  """Removes the account. The personal-data access trail loses their name with it."""
  whitelabelCrmDeleteUser(tenant: ID, id: ID!): CrmMutationResult!

  """Turns a whitelabel's CRM on or off and sets its seat limit. Super Admin only."""
  setCrmWhitelabelSettings(
    tenant: String!
    enabled: Boolean!
    seatLimit: Int!
    sessionIdleMinutes: Int
    enforceIpAllowlist: Boolean
  ): CrmSettings!
  """Creates the whitelabel's first CRM administrator. Run from the admin panel."""
  crmCreateFirstAdmin(
    tenant: String!
    name: String!
    username: String!
    password: String!
    email: String
  ): CrmMutationResult!

  crmAddPlayerNote(input: CrmAddPlayerNoteInput!): CrmPlayerNotePayload!
  crmSetNotePinned(id: ID!, isPinned: Boolean!): CrmMutationResult!
  crmDeletePlayerNote(id: ID!): CrmMutationResult!

  crmCreateTag(name: String!, colour: String, description: String): CrmMutationResult!
  crmUpdateTag(id: ID!, name: String, colour: String, description: String): CrmMutationResult!
  crmArchiveTag(id: ID!, archived: Boolean!): CrmMutationResult!
  """Folds one tag into another, moving every player across."""
  crmMergeTags(fromId: ID!, intoId: ID!): CrmMutationResult!
  crmApplyTags(playerIds: [ID!]!, tagIds: [ID!]!): CrmMutationResult!
  crmRemoveTags(playerIds: [ID!]!, tagIds: [ID!]!): CrmMutationResult!

  """Records a responsible-gambling flag. Blocking types stop staking and deposits at once."""
  crmRaiseRgFlag(
    playerId: ID!
    flagType: String!
    "player | operator"
    initiatedBy: String!
    reason: String
    "Required for COOLING_OFF."
    endsAt: String
    "For SELF_EXCLUSION. Defaults to six months."
    minTermMonths: Int
  ): CrmMutationResult!
  """Ends a block. Cannot be done by whoever raised it, nor before the minimum term."""
  crmLiftRgFlag(flagId: ID!, reason: String!): CrmMutationResult!
  """Records a consent change. Withdrawal is never refused."""
  crmRecordConsent(
    playerId: ID!
    channel: String!
    purpose: String!
    state: String!
    source: String!
    evidenceRef: String
    consentTextVersion: String
    reason: String
  ): CrmMutationResult!

  crmCreateTask(
    bookId: ID!
    title: String!
    slaMinutes: Int!
    playerId: ID
    assigneeId: ID
    body: String
    priority: String
  ): CrmMutationResult!
  """
  Raises the same task for a set of players.

  Takes the players that were selected, not a filter: "everyone matching this
  segment" is one click from forty thousand tasks, and what a re-run filter
  returns is not what the caller saw. Capped at 200.

  Every task carries a dedupe key, so a double-clicked batch creates its tasks
  once and reports the rest as already open. The same work can be raised again
  for a player once the previous one is closed.
  """
  crmCreateTasksForPlayers(
    playerIds: [ID!]!
    bookId: ID!
    title: String!
    slaMinutes: Int!
    assigneeId: ID
    body: String
    priority: String
  ): CrmBulkTaskResult!

  """Closing a task requires an outcome — a task closed with none tells the next person nothing."""
  crmSetTaskStatus(taskId: ID!, status: String!, outcome: String): CrmMutationResult!
  crmAssignTask(taskId: ID!, assigneeId: ID): CrmMutationResult!
  """Stops the escalation ladder. Whoever acknowledges is saying they have it."""
  crmAcknowledgeTask(taskId: ID!): CrmMutationResult!
  crmMarkNotificationsRead(ids: [ID!]): CrmMutationResult!

  """Records that someone tried to reach a player, and what came of it."""
  crmRecordContactAttempt(
    playerId: ID!
    channel: String!
    outcome: String!
    taskId: ID
    notes: String
    direction: String
  ): CrmMutationResult!

  """Marks yourself away. Escalations skip you and follow your delegate, one hop."""
  crmSetMyAvailability(outOfOfficeUntil: String, delegateTo: ID): CrmMutationResult!

  """
  Sets the hours this desk works.

  Refuses rather than clamps: a time zone this server does not recognise would
  throw inside task creation, and hours that are empty or inverted describe a
  desk that is never open, which stops every escalation and says nothing.

  Applies to deadlines computed after it. Tasks already open keep the deadline
  they were given, because moving them would create or clear breaches that
  nobody acted on.
  """
  crmSetDeskCalendar(
    "An IANA zone, e.g. Asia/Kolkata."
    timezone: String!
    "Minutes past midnight. Must be before closeMinute."
    openMinute: Int!
    "Minutes past midnight, up to 1440 for midnight."
    closeMinute: Int!
    "ISO weekdays, 1 = Monday. At least one."
    days: [Int!]!
  ): CrmMutationResult!

  """
  Saves the current player filter under a name.

  Takes `crm.players:view` — saving a filter you can already run confers
  nothing, and running it still resolves through your own books. Sharing one
  with the whole desk additionally takes `crm.players:view_all`: that is an
  authorship control, not a scope one, so a single agent cannot put work
  definitions in front of the whitelabel.
  """
  crmCreateSegment(
    name: String!
    description: String
    filter: CrmPlayerFilterInput
    isShared: Boolean
  ): CrmMutationResult!
  """Only its author may change a segment, shared or not."""
  crmUpdateSegment(
    id: ID!
    name: String
    description: String
    filter: CrmPlayerFilterInput
    isShared: Boolean
  ): CrmMutationResult!
  crmDeleteSegment(id: ID!): CrmMutationResult!

  """
  Redacts the free text staff wrote about a player — note bodies, contact
  notes, task text. The rows stay: that work happened is a processing record,
  what was written about the person is the personal data.

  Never touches the exclusion register (its hashes are what keep a
  self-excluded player excluded), responsible-gambling episodes, or consent
  records — the law requires those kept. `reason` is the request reference and
  is mandatory; the erasure itself is audited.
  """
  crmDsarErase(playerId: ID!, reason: String!): CrmDsarEraseResult!
}
