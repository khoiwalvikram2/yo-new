enum AdvertisementType {
  BANNER
  PROMOTIONAL
  FEATURED
}

enum AdvertisementStatus {
  ACTIVE
  INACTIVE
}

enum AdvertisementDeviceType {
  DESKTOP
  MOBILE
  BOTH
}

type Advertisement {
  id: ID!
  title: String!
  subtitle: String
  imageUrl: String
  type: AdvertisementType!
  url: String
  order: Int!
  status: AdvertisementStatus!
  deviceType: AdvertisementDeviceType!
  createdAt: String!
  updatedAt: String!
}

input CreateAdvertisementInput {
  title: String!
  subtitle: String
  imageUrl: String!
  type: AdvertisementType!
  url: String
  order: Int
  status: AdvertisementStatus
  deviceType: AdvertisementDeviceType
}

input UpdateAdvertisementInput {
  id: ID!
  title: String
  subtitle: String
  imageUrl: String
  type: AdvertisementType
  url: String
  order: Int
  status: AdvertisementStatus
  deviceType: AdvertisementDeviceType
}

input ReorderAdvertisementInput {
  id: ID!
  order: Int!
}


