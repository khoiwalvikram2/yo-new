# --- Casino Management Hierarchy ---

enum CasinoMainCategory { LIVE_CASINO CASINO SLOTS }
enum CasinoCategoryType { GENERAL TOP FEATURED LOUNGE }

type CasinoApiProvider {
  id: ID!
  key: String!
  name: String!
  status: String!
  lastSyncAt: String
}

type CasinoVendor {
  id: ID!
  name: String!
  slug: String!
}

type WhitelabelCasinoVendorSettings {
  vendorId: ID!
  enabled: Boolean!
  displayOrder: Int
  updatedAt: String
}

type CasinoVendorWithSettings {
  id: ID!
  name: String!
  slug: String!
  enabled: Boolean
  gamesCount: Int
  enabledGamesCount: Int
  displayOrder: Int
}

type WhitelabelCasinoGameSettings {
  enabled: Boolean!
  order: Int
  featured: Boolean
  premiumOnly: Boolean
  tags: [String!]
}

type CasinoGameLimits {
  minStake: Float
  maxStake: Float
  maxWin: Float
  maxWinTarget: String
  maxWinPlayers: [String!]
}

type CasinoGameBetSettings {
  id: ID!
  gameId: ID!
  playerId: String
  playerName: String
  playerPhone: String
  betEnabled: Boolean!
  minStake: Float
  maxStake: Float
  maxWin: Float
  createdAt: String!
  updatedAt: String!
}

type CasinoGame {
  id: ID!
  name: String!
  slug: String!
  mainCategory: CasinoMainCategory!
  vendorId: ID!
  vendorName: String!
  thumbnailUrl: String
  rtp: Float
  demoUrl: String
  isActive: Boolean!
  tenantEnabled: Boolean
  premiumOnly: Boolean
  betSettingsCount: Int!
  order: Int
  featured: Boolean
  limits: CasinoGameLimits
  betSettings: [CasinoGameBetSettings!]
  updatedAt: String
  # True if the game is already assigned to any custom category (across all main categories)
  categoryAssigned: Boolean
}

input GamesQueryInput {
  providerId: ID  # Optional: if not provided, fetch games from all providers (for whitelabel admin)
  category: CasinoMainCategory  # Optional: omitted for the "All" view, which pages all three on the server
  vendorId: ID
  vipTierId: ID
  search: String
  enabled: Boolean
  page: Int
  pageSize: Int
}

type GamesPage {
  total: Int!
  page: Int!
  pageSize: Int!
