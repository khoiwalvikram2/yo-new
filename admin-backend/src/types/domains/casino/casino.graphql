# Casino Bets
enum CasinoBetStatus { pending active won lost cancelled void }

type CasinoBet {
  id: ID!
  tenant: String
  whitelabelId: String!
  userId: String!
  userName: String
  userPhone: String
  gameId: ID!
  gameName: String
  providerId: ID
  providerCode: String
  sessionId: String
  vendorId: ID!
  vendorName: String!
  tableId: String
  stake: Float!
  payout: Float
  winAmount: Float
  netAmount: Float
  status: CasinoBetStatus!
  gameRoundId: String
  transactionId: String
  settledAt: String
  currency: String!
  metadata: JSON
  createdAt: String!
  updatedAt: String!
  walletType: String
  campaign: BetCampaignDetail
}

input CasinoBetsQuery {
  tenant: String
  whitelabelId: String
  userId: String
  gameId: ID
  vendorId: ID
  tableId: String
  status: CasinoBetStatus
  statuses: [CasinoBetStatus!]
  dateFrom: String
  dateTo: String
  limit: Int
  offset: Int
}

type CasinoBetsPage {
  items: [CasinoBet!]!
  total: Int!
}

# --- Live Casino Analytics (Subscriptions) ---

"""
Rolling-window KPIs for live casino activity.
All monetary fields are raw numbers; clients must format via currency rules.
"""
type CasinoLiveKpis {
  at: String!
  betsPerMin: Float!
  wagered: Float!
  payouts: Float!
  ggr: Float!
  rtp: Float!
  activePlayers: Int!
}

type CasinoGameStat {
  gameId: ID!
  gameName: String
  thumbnailUrl: String
  wagered: Float!
  payouts: Float!
  ggr: Float!
  bets: Int!
}

type CasinoProviderStat {
  providerId: ID!
  providerName: String
  wagered: Float!
  payouts: Float!
  ggr: Float!
  bets: Int!
}

type CasinoVendorStat {
  vendorId: ID!
  vendorName: String
  wagered: Float!
  payouts: Float!
  ggr: Float!
  bets: Int!
}

type CasinoLiveBreakdown {
  byGame: [CasinoGameStat!]!
  byProvider: [CasinoProviderStat!]!
  byVendor: [CasinoVendorStat!]!
}

type CasinoPlayerEvent {
  id: ID!
  userId: String!
  userName: String
  gameId: ID!
  gameName: String
  vendorName: String
  status: CasinoBetStatus!
  stake: Float!
  payout: Float
  at: String!
}

input LiveScope {
  tenant: String
  whitelabelId: String
  windowMins: Int
  matkaType: MatkaType
}

type CasinoLiveDashboard {
  kpis: CasinoLiveKpis!
  breakdown: CasinoLiveBreakdown!
}

extend type Subscription {
  casinoLiveDashboard(scope: LiveScope): CasinoLiveDashboard!
  casinoPlayerEvents(scope: LiveScope): CasinoPlayerEvent!
}

# --- Test Utilities (admin/internal) ---
input CreateTestCasinoBetInput {
  userId: Int!
  gameId: ID!
  stake: Float!
  payout: Float
  status: CasinoBetStatus
}

type GmagRoundDetailPayload {
  url: String
}

extend type Mutation {
  createTestCasinoBet(input: CreateTestCasinoBetInput!): CasinoBet!
  settleTestCasinoBet(id: ID!, payout: Float, status: CasinoBetStatus!): CasinoBet!
  gmagRoundDetail(roundId: String!, endTime: String!, providerCode: String!, language: String): GmagRoundDetailPayload
}

input CasinoSelectionInput {
  providerId: ID
  vendorId: ID
  search: String
  includeGameIds: [ID!]
  excludeGameIds: [ID!]
  page: Int
  pageSize: Int
}
extend type Query {
  casinoSelectionGames(input: CasinoSelectionInput!): CasinoSelectionPage!
  casinoSelectionGameIds(providerId: ID!, gameIds: [ID!]!): [ID!]!
}

type CasinoSelectionGame {
  id: ID!
  name: String!
  slug: String
  mainCategory: CasinoMainCategory!
  vendorId: ID!
  vendorName: String
  thumbnailUrl: String
}
type CasinoSelectionPage {
  total: Int!
  page: Int!
  pageSize: Int!
  items: [CasinoSelectionGame!]!
}
