  cancelBet(betId: ID!, reason: String!): MessageResponse!
  flagPlayer(userId: ID!, flag: String!, reason: String!): MessageResponse!
  unflagPlayer(userId: ID!, flag: String!): MessageResponse!
  dismissPattern(patternId: ID!, reason: String!): MessageResponse!
}

# Subscriptions
extend type Subscription {
  betPlaced(eventId: ID): SportsBet!
  patternDetected(eventId: ID): BettingPattern!
  automationTriggered(eventId: ID): JSON!
}

type SportsResultStats {
  total: Int!
  today: Int!
  exchange: Int!
  bookmaker: Int!
  fancy: Int!
  rolledBack: Int!
}
extend type Query { sportsResultStats: SportsResultStats! }
