"""
The Executive Dashboard's operations sections. Period figures follow the dateRange; pending counts, online,
balances, the credit pool and head counts are what is true now. Money is raw, in the whitelabel's own currency.
showB2C / showCredit say which sections apply: credit players or CREDIT agents make a whitelabel a credit
(chips) whitelabel; cash players, an enabled gateway or payment methods make it B2C. Both can be true.
"""
type DashboardOperations {
  showB2C: Boolean!
  showCredit: Boolean!
  """Approved deposit requests in the period (gateway and manual-proof requests)."""
  directDeposits: Float!
  """Admin wallet credits in the period that came with no deposit request."""
  manualDeposits: Float!
  directWithdrawals: Float!
  manualWithdrawals: Float!
  pendingDepositRequests: Int!
  pendingDepositAmount: Float!
  pendingWithdrawalRequests: Int!
  pendingWithdrawalAmount: Float!
  """Bank/UPI payout accounts waiting for approval."""
  pendingPayoutAccounts: Int!
  """Players who signed in or placed a bet in the last onlineWindowMins (there is no heartbeat)."""
  onlineNow: Int!
  onlineWindowMins: Int!
  """Players whose latest sign-in falls in the period."""
  loggedInPlayers: Int!
  """Distinct players with a bet placed in the period (sports, casino or matka)."""
  playersWhoBet: Int!
  """Distinct players with a bet open now."""
  playersWithOpenBet: Int!
  """Every bet placed in the period, open ones included (overviewKPIs.totalBets counts settled bets only)."""
  betsPlaced: Int!
  """Players registered since midnight IST."""
  registeredToday: Int!
  inactivePlayers: Int!
  suspendedPlayers: Int!
  """Players' cash wallet balance now."""
  walletBalance: Float!
  """Bonus awarded in the period (cancelled awards left out)."""
  bonusGiven: Float!
  sharingAgentsActive: Int!
  commissionAgentsActive: Int!
  chipsDepositedByWhitelabel: Float!
  chipsDepositedByAgents: Float!
  chipsWithdrawnByWhitelabel: Float!
  chipsWithdrawnByAgents: Float!
  chipsGivenToAgents: Float!
  creditLimit: Float!
  creditUsed: Float!
  creditAvailable: Float!
  """The whitelabel's settlement balance now."""
  settlementDue: Float!
  """Agent settlements posted in the period."""
  settledAmount: Float!
  """Credit players' available chips now."""
  chipsWithPlayers: Float!
  directPlayers: Int!
  agentPlayers: Int!
  creditAgentsActive: Int!
  """Open sports bets older than staleSportsHours, now."""
  staleSportsBets: Int!
  staleSportsEvents: Int!
  staleSportsHours: Int!
  """Casino rounds open longer than casinoStuckMinutes, now."""
  stuckCasinoRounds: Int!
  casinoStuckMinutes: Int!
  """Open matka bets whose draw day is before today (IST), now."""
  overdueMatkaBets: Int!
  overdueMatkaMarkets: Int!
}

