  adjustWhitelabelCredit(input: AdjustWhitelabelCreditInput!): WhitelabelPayload!
  updateAdminPreferences(input: AdminPreferencesInput!): AdminPreferencesPayload!
  """Generate casino categories for a whitelabel from enabled providers (Gap/GMAG). Replaces existing categories."""
  generateCasinoCategories(tenantId: String!): GenerateCasinoCategoriesPayload!
  """Super-admin resets a whitelabel's admin login password. Requires the caller's own password to confirm."""
  resetWhitelabelAdminPassword(whitelabelId: ID!, adminEmail: String, newPassword: String!, adminPassword: String!): MessageResponse!
}

