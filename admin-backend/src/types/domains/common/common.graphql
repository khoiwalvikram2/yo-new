"""
What is happening right now, for the dashboard's "Real-time snapshot" card.
It deliberately ignores the dashboard period presets: the query takes no
dateRange, and every figure is measured back from the moment of the reading.
Money is in raw whitelabel-currency amounts, like every other dashboard figure.
"""
type RealtimeSnapshot {
  """ISO time the reading was taken. A cached reading keeps the time it was taken at."""
  at: String!
  """
  Distinct players who placed a bet (sports, casino or matka) in the trailing
  activityWindowMins. This is betting activity in a window, NOT presence: the
  platform records no heartbeat or last-seen time, so it cannot say who is online.
  """
  activePlayers: Int!
  """The activity window behind activePlayers, in minutes, so the label cannot drift from the query."""
  activityWindowMins: Int!
  """Bets open right now across sports (matched/unmatched), casino and matka (pending/active)."""
  activeBets: Int!
  """Approved deposit-request money settled in the trailing 60 minutes. Manual admin credits are not included."""
  depositsLastHour: Float!
  """Completed withdrawal-request money settled in the trailing 60 minutes. Manual admin debits are not included."""
  withdrawalsLastHour: Float!
}

"""
The live open book split by market, for the dashboard's "Exposure by market" card.
For an admin it splits exactly the "Exposure" figure of overviewKPIs, so for any
date range that ends today the rows add up to it: open sports liability
(matched/unmatched) per sport, plus one row for open matka potential payout
(pending/active, all matka types). No date filter and no dateRange argument:
this is what is open now. Casino is not included, because an open casino bet has
no known payout. Bets placed through the bet tool are included, as they are in
the Exposure figure. Amounts are raw, in the whitelabel base currency, like
overviewKPIs.exposure. In director core mode each whitelabel is read in its own
base currency and the amounts are added, exactly as overviewKPIs does; that
mixes currencies if whitelabels ever differ (all are INR today). An agent sees
only its own players, so its rows add up to less than overviewKPIs.exposure,
which does not scope agents at all.
"""
type ExposureByMarket {
  """ISO time the reading was taken. A cached reading keeps the time it was taken at."""
  at: String!
  """Ordered by amount (largest first), then label. Markets with nothing open are omitted."""
  markets: [ExposureByMarketRow!]!
}

type ExposureByMarketRow {
  """'sports:' followed by the sport's key, or 'matka'."""
  key: String!
  """'sports' or 'matka'."""
  product: String!
  """The sport's name, or 'Matka'."""
  label: String!
  """Raw amount in the whitelabel base currency, like overviewKPIs.exposure."""
  amount: Float!
}

