# ---- CREDIT scheme on Deposit/Withdraw chips (spec docs/superpowers/specs/2026-11-02-credit-dw-chips-design.md §7) ----

enum ChipAccountType { AGENT PLAYER }
enum ChipMovementKind { OPENING DEPOSIT WITHDRAW CREDIT_REFERENCE }

"""A CREDIT-scheme account on Deposit/Withdraw chips. Ref P/L > 0: the upline owes this account; < 0: it owes the upline."""
type ChipAccount {
  accountType: ChipAccountType!
  id: ID!
  username: String!
  name: String
  status: String
  """Direct parent agent; null when the parent is the whitelabel (admin)."""
  parentAgentId: ID
  """PLAYER only: AGENT_CREDIT or WHITELABEL_CREDIT."""
  playerType: String
  currency: String!
  creditReference: Float!
  balance: Float!
  exposure: Float!
  available: Float!
  downlineBalance: Float!
  refPnl: Float!
  """Direct downline accounts (agents + players); 0 for a player."""
  downlineCount: Int!
}

type ChipPool { currency: String!, creditLimit: Float!, used: Float!, available: Float! }

type ChipTotals {
  creditReference: Float!
  balance: Float!
  exposure: Float!
  available: Float!
  downlineBalance: Float!
  refPnl: Float!
}

type ChipDownline {
  """The agent whose downline this is; null for the admin's (whitelabel's) downline."""
  parent: ChipAccount
  """Admin only: the whitelabel pool that feeds root accounts."""
  pool: ChipPool
  items: [ChipAccount!]!
  total: Int!
  totals: ChipTotals!
}

type ChipStatementRow {
  id: ID!
  createdAt: String!
  kind: ChipMovementKind!
  """Signed for this account: + chips in, - chips out."""
  amount: Float!
  balanceBefore: Float!
  balanceAfter: Float!
  creditReferenceBefore: Float
  creditReferenceAfter: Float
  counterpartyType: String
  counterpartyId: ID
  counterpartyName: String
  remark: String
  createdBy: String
}

type ChipStatementPage { rows: [ChipStatementRow!]!, total: Int! }

input ChipTransferInput { accountType: ChipAccountType!, accountId: ID!, amount: Float!, remark: String }
input CreditReferenceInput { accountType: ChipAccountType!, accountId: ID!, creditReference: Float!, remark: String }

type ChipTransferResult {
  account: ChipAccount!
  """The agent that gave or received the chips; null when it was the whitelabel."""
  parent: ChipAccount
  """Set when the whitelabel pool was the other side."""
  pool: ChipPool
  transferId: ID!
}

type AgentsQuery {
  agentMe: AgentAccount
  agentProfile(id: ID!): AgentAccount
  agentTree(rootId: ID!, depth: Int = 5): [AgentAccount!]!
  agentDescendantIds(agentId: ID!): [ID!]!
  agentRootIds: [ID!]!
  agentRootAgents: [AgentBasicInfo!]!
  agentsPage(
    query: String
    schemeType: AgentScheme
    status: String
    parentAgentId: ID
    directOnly: Boolean
    offset: Int
    limit: Int
    includeStats: Boolean
  ): AgentsPageResult!
  checkAgentUsernameAvailable(username: String!, excludeAgentId: String): CheckAvailabilityResult!
  agentLedgers(agentId: ID!, periodFrom: String!, periodTo: String!): [AgentLedgerLine!]!
  agentSettlements(agentId: ID!, periodFrom: String!, periodTo: String!): [AgentSettlement!]!
  """ Settlements done by the logged-in agent to their direct sub-agents (downline - "maine sub-agents ko settle kiya"). """
  downlineSettlementHistory(periodFrom: String!, periodTo: String!): [AgentSettlement!]!
  agentKPIs(agentId: ID!, periodFrom: String!, periodTo: String!): AgentGGRSummary!
  agentDashboardStats(agentId: ID!, dateFrom: String, dateTo: String): AgentDashboardStats!
  commissionSummary(agentId: ID!, periodFrom: String!, periodTo: String!): CommissionSummary!
  commissionHistory(
    agentId: ID!
    periodFrom: String!
    periodTo: String!
    currency: String
    domain: AgentDomain
    playerId: ID
    limit: Int
    offset: Int
  ): CommissionHistoryResult!
  commissionReport(
    agentId: ID!
    periodFrom: String!
    periodTo: String!
    currency: String
    domain: AgentDomain
    limit: Int
    offset: Int
  ): CommissionReport!
  directPlayerCommissionSummaries(
    agentId: ID
    periodFrom: String!
    periodTo: String!
  ): [DirectPlayerCommissionSummary!]!
  settlementSummary(agentId: ID!, periodFrom: String!, periodTo: String!): SettlementSummary!
  agentActivity(agentId: ID!, limit: Int = 10): [AgentActivityEvent!]!
  agentSecurityAudit(agentId: ID!, limit: Int): [PlayerSecurityEvent!]!
  # Chips (spec 2026-11-02 §7). An agent reads itself and its subtree; an admin the CREDIT accounts of its tenant.
  chipAccount(accountType: ChipAccountType!, accountId: ID!): ChipAccount
  myChipAccount: ChipAccount
  chipDownline(parentAgentId: ID, query: String, accountType: ChipAccountType, offset: Int, limit: Int): ChipDownline!
  chipStatement(accountType: ChipAccountType!, accountId: ID!, from: String, to: String, offset: Int, limit: Int): ChipStatementPage!
  chipPool: ChipPool
}

type AgentsMutation {
  createAgent(input: CreateAgentInput!): AgentAccount!
  updateAgent(input: UpdateAgentInput!): AgentAccount!
  setAgentCredentials(input: SetCredentialsInput!): Boolean!
  setCommissionConfig(input: SetCommissionConfigInput!): CommissionConfig!
  setSharingConfig(input: SetSharingConfigInput!): SharingConfig!
  settleAgent(input: SettleInput!): AgentSettlement! @deprecated(reason: "Use top-level settleAgent mutation (SettleAgentInput) instead")
  postSettlement(settlementId: ID!): AgentSettlement!
  agentLogin(input: AgentLoginInput!): AgentAuthPayload!
  # Status management
  updateAgentStatus(agentId: ID!, status: String!): AgentAccount!
  # Hierarchy management mutations
  suspendSubAgent(agentId: ID!, reason: String): AgentAccount!
  blockSubAgent(agentId: ID!, reason: String): AgentAccount!
  changeAgentPassword(currentPassword: String!, newPassword: String!): MessageResponse!
  adminResetAgentPassword(agentId: ID!, newPassword: String!, adminPassword: String!): MessageResponse!
  # Chips (spec 2026-11-02 §7): only the account's direct parent may move its chips or set its credit reference.
  # They replace the credit-limit model's money mutations, which spec §6 retired and which are gone from the API.
  depositChips(input: ChipTransferInput!): ChipTransferResult!
  withdrawChips(input: ChipTransferInput!): ChipTransferResult!
  setCreditReference(input: CreditReferenceInput!): ChipAccount!
}

extend type Query {
  agents: AgentsQuery!
}

extend type Mutation {
  agents: AgentsMutation!
}


