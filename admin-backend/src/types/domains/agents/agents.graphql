enum AgentScheme {
  COMMISSION
  SHARING
  CREDIT
}

enum AgentDomain {
  sports
  casino
  matka
}

enum PlayerType {
  REGULAR
  AGENT_CREDIT
  WHITELABEL_CREDIT
  SHARING_AGENT_PLAYER
  COMMISSION_AGENT_PLAYER
}

enum CreditTransactionType {
  ALLOCATION
  DEPOSIT
  WITHDRAWAL
  TRANSFER
  USAGE
  RELEASE
  ADJUSTMENT
  CREDIT_LIMIT_ADJUSTMENT
  CREDIT_USED_INCREASE
  CREDIT_USED_DECREASE
}

type AgentDomainRate {
  domain: AgentDomain!
  rate: Float!
}

type AgentBasicInfo {
  id: ID!
  username: String
  schemeType: AgentScheme!
  rate: Float
}

type AgentAccount {
  id: ID!
  tenantId: ID!
  username: String
  phone: String
  schemeType: AgentScheme!
  allowedDomains: [AgentDomain!]!
  status: String!
  parentAgentId: ID
  parentAgent: AgentAccount
  levelIndex: Int
  tallyEnabled: Boolean
  tallyDomains: [AgentDomain!]
  commissionRates: [AgentDomainRate!]
  sharingRates: [AgentDomainRate!]
  creditLimit: Float
  creditUsed: Float
  creditAvailable: Float
  creditAlertThreshold: Float
  settlementBalance: Float
  settlementBalanceSports: Float
  settlementBalanceCasino: Float
  settlementBalanceMatka: Float
  settlementBalanceByDomain: [DomainSettlement!]!
  """CREDIT agents only: the agent's chip figures, resolved in batch for lists; null for other schemes."""
  chips: ChipAccount
  """The ancestor that restricts this agent whatever its own status says, or null: a SUSPENDED or BLOCKED one blocks its sign-in, an INACTIVE one makes it read-only, and under either its players cannot place new bets. The nearest blocking one wins over an INACTIVE one. An agent caller sees one inside its own subtree only."""
  blockedByAncestor: AgentAncestorBlock
  createdAt: String!
}

"""An agent's nearest restricting ancestor (AgentAccount.blockedByAncestor)."""
type AgentAncestorBlock {
  id: ID!
  username: String
  status: String!
}

type AgentWallet {
  agentId: ID!
  currency: String!
  balance: Float!
  lockedBalance: Float!
  updatedAt: String!
}

type CommissionConfig {
  id: ID!
  agentId: ID!
  domain: AgentDomain!
  commissionRate: Float!
  effectiveFrom: String!
  effectiveTo: String
}

type SharingConfig {
  id: ID!
  agentId: ID!
  domain: AgentDomain!
  shareRate: Float!
  basis: String!
  effectiveFrom: String!
  effectiveTo: String
}

type AgentLedgerLine {
  id: ID!
  agentId: ID!
  domain: AgentDomain!
  periodFrom: String!
  periodTo: String!
  lineType: String!
  amount: Float!
  currency: String!
  refKey: String
  createdAt: String!
}

type AgentSettlement {
  id: ID!
  agentId: ID!
  periodFrom: String!
  periodTo: String!
  totalAmount: Float!
  direction: String! # TO_AGENT = platform pays to agent, FROM_AGENT = platform collects from agent
  currency: String!
  status: String!
  postedAt: String
  postedBy: ID
  createdAt: String!
  notes: String
  """ When present, the agent who was settled (e.g. for downline history, the sub-agent). """
  agent: AgentBasicInfo
}

input CreateAgentInput {
  schemeType: AgentScheme!
  allowedDomains: [AgentDomain!]!
  status: String
  parentAgentId: ID
  levelIndex: Int
  tallyEnabled: Boolean
  tallyDomains: [AgentDomain!]
  username: String!
  password: String!
  phone: String
  currency: String!
  # CREDIT agents only: the credit reference (a reference figure; it gates nothing and moves no chips).
  creditLimit: Float
  # CREDIT agents only: chips deposited at creation from the new agent's parent (root: the whitelabel pool).
  openingChips: Float
}

input UpdateAgentInput {
  id: ID!
  allowedDomains: [AgentDomain!]
  status: String
  parentAgentId: ID
  levelIndex: Int
  tallyEnabled: Boolean
  tallyDomains: [AgentDomain!]
}

input SetCredentialsInput {
  agentId: ID!
  username: String!
  # At least 6 characters, as for every agent password.
  password: String!
  # The caller's own login password: an agent changing its own credentials gives its current one, a parent agent or
  # an admin gives theirs. Setting credentials ends the agent's existing sessions and is audited.
  currentPassword: String!
}

input SetCommissionConfigInput {
  agentId: ID!
  domain: AgentDomain!
  commissionRate: Float!
  effectiveFrom: String!
  effectiveTo: String
}

input SetSharingConfigInput {
  agentId: ID!
  domain: AgentDomain!
  shareRate: Float!
  effectiveFrom: String!
  effectiveTo: String
}

input SettleInput {
  agentId: ID!
  periodFrom: String!
  periodTo: String!
  currency: String!
}

input AgentLoginInput {
  username: String!
  password: String!
}

type AgentAuthPayload {
  token: String!
  agent: AgentAccount!
  permissions: [Permission!]!
  tenant: String
  isReadOnly: Boolean
}

type AgentGGRSummary {
  sportsGGR: Float!
  casinoGGR: Float!
  matkaGGR: Float!
  totalGGR: Float!
}

type AgentListStats {
  # Common for all scheme types
  activePlayers: Int!
  lastLogin: String
  daysSinceLastBet: Int
  
  # For SHARING and CREDIT agents
  totalDeposits: Float
  totalWithdrawals: Float
  ggr: Float
  totalExposure: Float
  profitLoss: Float
  plTrend: String
  betCount: Int
  pendingSettlement: Float
  totalSettled: Float
  lastSettlementDate: String
  
  # For COMMISSION agents
  turnover: Float
  commissionEarned: Float
  commissionTrend: String
}

type AgentWithStats {
  agent: AgentAccount!
  stats: AgentListStats!
}

type AgentsPageResult {
  items: [AgentAccount!]!
  itemsWithStats: [AgentWithStats!]
  total: Int!
}

type AgentActivityEvent {
  id: ID!
  type: String!
  timestamp: String!
  playerName: String!
  playerId: String!
  amount: Float
  currency: String
  domain: String
  details: String
}

type AgentDashboardStats {
  totalPlayers: Int!
  activePlayers24h: Int!
  newPlayersToday: Int!
  pendingDeposits: Int!
  pendingDepositsAmount: Float!
  pendingWithdrawals: Int!
  pendingWithdrawalsAmount: Float!
  totalDeposits: Float!
  totalWithdrawals: Float!
  directDeposits: Float!
  directWithdrawals: Float!
  manualDeposits: Float!
  manualWithdrawals: Float!
  ggr: Float!
  profitLoss: Float!
  ggrByWalletType: WalletTypeBreakdown!
  plByWalletType: WalletTypeBreakdown!
  directPlayerCount: Int
  subAgentPlayerCount: Int
  totalSubAgents: Int
  totalDownlineBalance: Float
  totalDownlineExposure: Float
  sportsGgr: Float
  sportsPl: Float
  casinoGgr: Float
  casinoPl: Float
  matkaGgr: Float
  matkaPl: Float
}

"Tally rules metadata: whether cross-domain offset is enabled and which domains are included."
type TallyApplied {
  enabled: Boolean!
  domains: [AgentDomain!]!
}

type CommissionSummary {
  totalEarned: Float!
  calculatedTotal: Float
  pending: Float!
  paid: Float!
  sportsCommission: Float!
  casinoCommission: Float!
  matkaCommission: Float!
  currency: String!
  sportsGGR: Float
  casinoGGR: Float
  matkaGGR: Float
  "GGR from agent's direct players only (for Apna / retained display)."
  directSportsGGR: Float
  directCasinoGGR: Float
  directMatkaGGR: Float
  sportsCommissionRate: Float
  casinoCommissionRate: Float
  matkaCommissionRate: Float
  "Net commission (retained by this agent after sub-agent payables). Present when caller is admin."
  netSportsCommission: Float
  netCasinoCommission: Float
  netMatkaCommission: Float
  "Settlement total after tally rules (used for pending/payable)."
  effectiveCalculatedTotal: Float!
  effectiveSportsCommission: Float!
  effectiveCasinoCommission: Float!
  effectiveMatkaCommission: Float!
  tallyApplied: TallyApplied!
  "GROSS whatever the caller: what the agent's payer owes it (rate x subtree GGR, cycle by cycle), before tally rules."
  grossSportsCommission: Float
  grossCasinoCommission: Float
  grossMatkaCommission: Float
  "GROSS after tally rules, per cycle (the Receivable; what payCommission pays the agent)."
  grossEffectiveSportsCommission: Float
  grossEffectiveCasinoCommission: Float
  grossEffectiveMatkaCommission: Float
  grossEffectiveCalculatedTotal: Float
  "NET after tally (My Share): grossEffective minus what the agent owes its direct sub-agents (their grossEffective)."
  netEffectiveSportsCommission: Float
  netEffectiveCasinoCommission: Float
  netEffectiveMatkaCommission: Float
  netEffectiveCalculatedTotal: Float
  "Loss carried into the period's weeks from the week before each (one week only, from the week of 2026-10-19 IST). The totals are after it; the per-domain figures are before it."
  carriedLoss: Float
  "The part of carriedLoss taken off the gross (never below 0); the rest is forgiven."
  carryApplied: Float
  "The latest week's loss (what the floor removed from its gross), which carries into the next week."
  lossThisCycle: Float
}

