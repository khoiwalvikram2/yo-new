  playerId: ID!
  creditLimit: Float!
  reason: String
}

input WhitelabelCreditOperationInput {
  playerId: ID!
  amount: Float!
  reason: String
}

type AgentsQuery {
  agentMe: AgentAccount
  agentProfile(id: ID!): AgentAccount
  agentTree(rootId: ID!, depth: Int = 5): [AgentAccount!]!
  agentDescendantIds(agentId: ID!): [ID!]!
  agentRootIds: [ID!]!
  agentRootAgents: [AgentBasicInfo!]!
  agentsPage(
    query: String
    schemeType: AgentScheme
    status: String
    parentAgentId: ID
    directOnly: Boolean
    offset: Int
    limit: Int
    includeStats: Boolean
  ): AgentsPageResult!
  checkAgentUsernameAvailable(username: String!, excludeAgentId: String): CheckAvailabilityResult!
  agentLedgers(agentId: ID!, periodFrom: String!, periodTo: String!): [AgentLedgerLine!]!
  agentSettlements(agentId: ID!, periodFrom: String!, periodTo: String!): [AgentSettlement!]!
  """ Settlements done by the logged-in agent to their direct sub-agents (downline - "maine sub-agents ko settle kiya"). """
  downlineSettlementHistory(periodFrom: String!, periodTo: String!): [AgentSettlement!]!
  agentKPIs(agentId: ID!, periodFrom: String!, periodTo: String!): AgentGGRSummary!
  agentDashboardStats(agentId: ID!, dateFrom: String, dateTo: String): AgentDashboardStats!
  commissionSummary(agentId: ID!, periodFrom: String!, periodTo: String!): CommissionSummary!
  commissionHistory(
    agentId: ID!
    periodFrom: String!
    periodTo: String!
    currency: String
    domain: AgentDomain
    playerId: ID
    limit: Int
    offset: Int
  ): CommissionHistoryResult!
  commissionReport(
    agentId: ID!
    periodFrom: String!
    periodTo: String!
    currency: String
    domain: AgentDomain
    limit: Int
    offset: Int
  ): CommissionReport!
  directPlayerCommissionSummaries(
    agentId: ID
    periodFrom: String!
    periodTo: String!
  ): [DirectPlayerCommissionSummary!]!
  settlementSummary(agentId: ID!, periodFrom: String!, periodTo: String!): SettlementSummary!
  creditAllocation(agentId: ID!): CreditAllocation
  agentActivity(agentId: ID!, limit: Int = 10): [AgentActivityEvent!]!
  agentSecurityAudit(agentId: ID!, limit: Int): [PlayerSecurityEvent!]!
  creditTransactionHistory(
    entityType: String!
    entityId: ID!
    transactionTypes: [CreditTransactionType!]
    from: String
    to: String
    limit: Int
  ): [CreditTransaction!]!
  agentCreditTransactions(agentId: ID!, limit: Int, offset: Int): [CreditTransaction!]!
  agentCreditTransactionsCount(agentId: ID!): Int!
  agentPlayerCredits(agentId: ID!): [PlayerCreditSummary!]!
  previewCreditReconciliation(agentId: ID!): AgentCreditRecalculationResult!
  agentCreditAlerts(agentId: ID!, isActive: Boolean): [AgentCreditAlert!]!
  whitelabelCreditPlayers: [WhitelabelCreditPlayer!]!
}

type AgentsMutation {
  createAgent(input: CreateAgentInput!): AgentAccount!
  updateAgent(input: UpdateAgentInput!): AgentAccount!
  setAgentCredentials(input: SetCredentialsInput!): Boolean!
  setCommissionConfig(input: SetCommissionConfigInput!): CommissionConfig!
  setSharingConfig(input: SetSharingConfigInput!): SharingConfig!
  settleAgent(input: SettleInput!): AgentSettlement! @deprecated(reason: "Use top-level settleAgent mutation (SettleAgentInput) instead")
  postSettlement(settlementId: ID!): AgentSettlement!
  agentLogin(input: AgentLoginInput!): AgentAuthPayload!
  # Status management
  updateAgentStatus(agentId: ID!, status: String!): AgentAccount!
  # Hierarchy management mutations
  adjustSubAgentCredit(agentId: ID!, creditLimit: Float!): AdjustSubAgentCreditPayload!
  adjustAgentCredit(input: AdjustAgentCreditInput!): AgentCreditAdjustmentPayload!
  suspendSubAgent(agentId: ID!, reason: String): AgentAccount!
  blockSubAgent(agentId: ID!, reason: String): AgentAccount!
  # Credit management mutations
  allocateCreditToPlayer(input: AllocateCreditToPlayerInput!): PlayerCreditSummary!
  depositCredit(input: CreditOperationInput!): CreditAllocation!
  withdrawCredit(input: CreditOperationInput!): CreditAllocation!
  transferCredit(input: TransferCreditInput!): Boolean!
  settleSharingAgent(input: SettlementInput!): AgentSettlement!
  applyCreditReconciliation(agentId: ID!): Boolean!
  setAgentCreditAlertThreshold(agentId: ID!, threshold: Float!): CreditAllocation!
  resolveAgentCreditAlert(alertId: ID!): Boolean!
  changeAgentPassword(currentPassword: String!, newPassword: String!): MessageResponse!
  adminResetAgentPassword(agentId: ID!, newPassword: String!, adminPassword: String!): MessageResponse!
  # Whitelabel credit player mutations
  adjustWhitelabelPlayerCredit(input: AdjustWhitelabelPlayerCreditInput!): WhitelabelCreditPlayer!
  depositCreditToWhitelabelPlayer(input: WhitelabelCreditOperationInput!): WhitelabelCreditPlayer!
  withdrawCreditFromWhitelabelPlayer(input: WhitelabelCreditOperationInput!): WhitelabelCreditPlayer!
}

extend type Query {
  agents: AgentsQuery!
}

extend type Mutation {
  agents: AgentsMutation!
}


