enum AgentScheme {
  COMMISSION
  SHARING
  CREDIT
}

enum AgentDomain {
  sports
  casino
  matka
}

enum PlayerType {
  REGULAR
  AGENT_CREDIT
  WHITELABEL_CREDIT
  SHARING_AGENT_PLAYER
  COMMISSION_AGENT_PLAYER
}

enum CreditTransactionType {
  ALLOCATION
  DEPOSIT
  WITHDRAWAL
  TRANSFER
  USAGE
  RELEASE
  ADJUSTMENT
  CREDIT_LIMIT_ADJUSTMENT
  CREDIT_USED_INCREASE
  CREDIT_USED_DECREASE
}

type AgentDomainRate {
  domain: AgentDomain!
  rate: Float!
}

type AgentBasicInfo {
  id: ID!
  username: String
  schemeType: AgentScheme!
  rate: Float
}

type AgentAccount {
  id: ID!
  tenantId: ID!
  username: String
  phone: String
  schemeType: AgentScheme!
  allowedDomains: [AgentDomain!]!
  status: String!
  parentAgentId: ID
  parentAgent: AgentAccount
  levelIndex: Int
  tallyEnabled: Boolean
  tallyDomains: [AgentDomain!]
  commissionRates: [AgentDomainRate!]
  sharingRates: [AgentDomainRate!]
  creditLimit: Float
  creditUsed: Float
  creditAvailable: Float
  creditAlertThreshold: Float
  settlementBalance: Float
  settlementBalanceSports: Float
  settlementBalanceCasino: Float
  settlementBalanceMatka: Float
  settlementBalanceByDomain: [DomainSettlement!]!
  createdAt: String!
}

type AgentWallet {
  agentId: ID!
  currency: String!
  balance: Float!
  lockedBalance: Float!
  updatedAt: String!
}

type CommissionConfig {
  id: ID!
  agentId: ID!
  domain: AgentDomain!
  commissionRate: Float!
  effectiveFrom: String!
  effectiveTo: String
}

type SharingConfig {
  id: ID!
  agentId: ID!
  domain: AgentDomain!
  shareRate: Float!
  basis: String!
  effectiveFrom: String!
  effectiveTo: String
}

type AgentLedgerLine {
  id: ID!
  agentId: ID!
  domain: AgentDomain!
  periodFrom: String!
  periodTo: String!
  lineType: String!
  amount: Float!
  currency: String!
  refKey: String
  createdAt: String!
}

type AgentSettlement {
  id: ID!
  agentId: ID!
  periodFrom: String!
  periodTo: String!
  totalAmount: Float!
  direction: String! # TO_AGENT = platform pays to agent, FROM_AGENT = platform collects from agent
  currency: String!
  status: String!
  postedAt: String
  postedBy: ID
  createdAt: String!
  notes: String
  """ When present, the agent who was settled (e.g. for downline history, the sub-agent). """
  agent: AgentBasicInfo
}

input CreateAgentInput {
  schemeType: AgentScheme!
  allowedDomains: [AgentDomain!]!
  status: String
  parentAgentId: ID
  levelIndex: Int
  tallyEnabled: Boolean
  tallyDomains: [AgentDomain!]
  username: String!
  password: String!
  phone: String
  currency: String!
  # CREDIT agents only: credit limit at creation (root: whitelabel pool; sub-agent: parent's available credit).
  creditLimit: Float
}

input UpdateAgentInput {
  id: ID!
  allowedDomains: [AgentDomain!]
  status: String
  parentAgentId: ID
  levelIndex: Int
  tallyEnabled: Boolean
  tallyDomains: [AgentDomain!]
}

input SetCredentialsInput {
  agentId: ID!
  username: String!
  password: String!
}

input SetCommissionConfigInput {
  agentId: ID!
  domain: AgentDomain!
  commissionRate: Float!
  effectiveFrom: String!
  effectiveTo: String
}

input SetSharingConfigInput {
  agentId: ID!
  domain: AgentDomain!
  shareRate: Float!
  effectiveFrom: String!
  effectiveTo: String
}

input SettleInput {
  agentId: ID!
  periodFrom: String!
  periodTo: String!
  currency: String!
}

input AllocateCreditToPlayerInput {
  agentId: ID!
  playerId: ID!
  amount: Float!
  reason: String
}

input CreditOperationInput {
  agentId: ID!
  targetEntityType: String!
  targetEntityId: ID!
  amount: Float!
  reason: String
}

input AdjustAgentCreditInput {
  agentId: ID!
  adjustmentType: String! # INCREASE | DECREASE | LIMIT_CHANGE
  amount: Float!
  notes: String
}

input TransferCreditInput {
  parentAgentId: ID!
  fromSubAgentId: ID!
  toSubAgentId: ID!
  amount: Float!
  reason: String
}

input SettlementInput {
  agentId: ID!
  periodFrom: String!
  periodTo: String!
