# Agent-specific inputs and payloads
input CreatePlayerForAgentInput {
  username: String!
  password: String!
  email: String
  phone: String
  name: String
  status: PlayerStatus
  currency: String
  initialBalance: Float
  # New fields for role-based player creation
  playerType: PlayerType
  agentId: ID # Target agent ID (self or sub-agent)
  creditLimit: Float # Required for credit players
  bonusAllowed: Boolean # Default false for credit players
  # Stake/limit fields (optional; applied on create via createPlayerDb limits)
  maxBetSports: Float
  maxBetCasino: Float
  maxBetMatka: Float
  dailyStakeLimit: Float
}

type CreatePlayerForAgentPayload {
  success: Boolean!
  message: String!
  playerId: ID
}

type PlayerActionPayload {
  success: Boolean!
  message: String!
}

