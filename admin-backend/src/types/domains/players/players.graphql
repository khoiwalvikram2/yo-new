# Player Profile Types

type PlayerProfile {
  id: ID!
  name: String!
  email: String
  phone: String
  username: String
  status: PlayerStatus!
  tenant: String
  createdAt: String
  lastLogin: String
  lastBet: String
  firstDeposit: String
  riskType: RiskType
  kycLevel: String
  kycStatus: String
  kycLastUpdate: String
  vipTierId: ID
  vipTierName: String
  wallet: Wallet
  limits: PlayerLimits
  access: PlayerAccess!
  playerType: PlayerType
  agentId: ID
  creditLimit: Float
  creditUsed: Float
  creditAvailable: Float
  settlementBalance: Float
  referredBy: ReferrerUser
}

type PlayerOverview {
  profile: PlayerProfile!
  kpis: PlayerKPIs!
  recentActivity: [PlayerActivityEvent!]!
  exposureByProduct: [ExposureByProduct!]!
  topProducts: [TopProduct!]!
}

