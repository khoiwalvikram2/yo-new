enum DepositMethod {
  BANK_TRANSFER
  UPI
  CRYPTO
}

enum DepositStatus {
  PENDING
  APPROVED
  REJECTED
  CANCELLED
}

type DepositRequest {
  id: ID!
  tenant: String!
  userId: ID!
  amount: Float!
  currency: String!
  method: DepositMethod!
  utr: String
  referenceId: String
  proofKey: String!
  proofUrl: String # Always null: a request never carries its screenshot; read it with Query.depositRequestProof(id)
  hasProof: Boolean! # The request has a screenshot or a link to show (Query.depositRequestProof answers it); false when a sentinel or a legacy S3 key is all it holds
  status: DepositStatus!
  reviewerId: ID
  reviewedAt: String
  note: String
  walletTxnId: ID
  cryptoAmount: Float # CRYPTO only: USDT the player was told to send
  cryptoRate: Float # CRYPTO only: currency per 1 USDT when the request was made
  cryptoNetwork: String # CRYPTO only: network of the wallet paid to, e.g. TRC20
  cryptoBonusPercent: Float # CRYPTO only: deposit bonus % in force when the request was made
  cryptoBonusAmount: Float # CRYPTO only: bonus paid into the cash wallet on approval, on top of amount
  bonusWalletTxnId: ID # CRYPTO only: ledger entry of the bonus credit
  createdAt: String!
  updatedAt: String!
  user: User # Resolved user info
  gateway: DepositGatewayInfo # Payment-gateway deposits only
}

# The payment-gateway pay-in behind a deposit. Gateway deposits are confirmed by the gateway, never approved by hand.
type DepositGatewayInfo {
  provider: String! # WELIVEPAY
  gateway: String! # Code of the gateway the pay-in used, e.g. QPC, IRISPAY
  gatewayName: String! # e.g. QuickPayCash
  orderId: String! # Our order reference sent to the gateway
  status: String! # pending | success | expired | invalid
  txnRef: String # Gateway UTR / transaction reference once paid
  expiresAt: String # When the checkout link expires (pending only)
}

type WhitelabelPaymentMethods {
  id: ID!
  tenant: String!
  enabledMethods: [String!]!
  banks: [BankDetails!]!
  upis: [UpiDetails!]!
  cryptos: [CryptoDetails!]!
  cryptoRate: Float # Deposit currency per 1 USDT, one rate for the whole whitelabel (null = not set; players see no wallet)
  cryptoBonusPercent: Float # Extra % on approved crypto deposits, 0-50 (null = no bonus)
  limits: DepositLimits!
  createdAt: String!
  updatedAt: String!
}

type BankDetails {
  vipTierIds: [ID!]
  id: String! # Unique identifier for this bank
  accountName: String!
  accountNumber: String!
  ifsc: String!
  bankName: String!
  branch: String!
  notes: String
  minAmount: Float # Minimum deposit amount for this bank (null = no limit)
  maxAmount: Float # Maximum deposit amount for this bank (null = no limit)
  weight: Int! # Priority/weight (higher = shown first, default: 0)
  enabled: Boolean! # Whether this bank account is enabled (default: true)
}

type UpiDetails {
  vipTierIds: [ID!]
  id: String! # Unique identifier for this UPI
  upiId: String!
  displayName: String
  qrKey: String
  qrUrl: String # Displayable QR (the stored data URI or link; null for a legacy S3 key)
  minAmount: Float # Minimum deposit amount for this UPI (null = no limit)
  maxAmount: Float # Maximum deposit amount for this UPI (null = no limit)
  weight: Int! # Priority/weight (higher = shown first, default: 0)
  enabled: Boolean! # Whether this UPI account is enabled (default: true)
}

# A USDT wallet players can deposit to.
type CryptoDetails {
  vipTierIds: [ID!]
  id: String!
  network: String! # TRC20 | BEP20 | ERC20 | POLYGON | SOLANA | TON
  walletAddress: String!
  displayName: String
  qrKey: String
  qrUrl: String # Displayable QR (the stored data URI or link; null for a legacy S3 key)
  minAmount: Float # Minimum deposit for this wallet (null = no limit)
  maxAmount: Float # Maximum deposit for this wallet (null = no limit)
  weight: Int! # Priority/weight (higher = shown first, default: 0)
  enabled: Boolean! # Whether this wallet is enabled (default: true)
}

type DepositLimits {
  min: Float!
  max: Float!
}

type DepositRequestListResult {
  items: [DepositRequest!]!
  total: Int!
}

# Inputs
input CreateDepositRequestInput {
  accountId: String
  amount: Float!
  currency: String!
  method: DepositMethod!
  utr: String # Required for UPI
  referenceId: String # Optional for BANK_TRANSFER
  proofKey: String! # The screenshot as a base64 image data URI, or 'manual' / 'proof-missing'
}

input ApproveDepositRequestInput {
  id: ID!
  note: String
}

input RejectDepositRequestInput {
  id: ID!
  note: String
}

input ListDepositRequestsInput {
  id: ID # One request by its id (task links); combine with no status or dates to find it whatever its age
  status: DepositStatus
  userId: ID
  method: DepositMethod
  source: String # MANUAL | GATEWAY
  includeGatewayOrders: Boolean # Also list gateway pay-ins not yet credited (awaiting payment, expired, invalid)
  fromDate: String
  toDate: String
  query: String
  offset: Int
  limit: Int
}

input UpsertWhitelabelPaymentMethodsInput {
  enabledMethods: [String!]
  banks: [BankDetailsInput!]
  upis: [UpiDetailsInput!]
  cryptos: [CryptoDetailsInput!] # Omit to keep the stored wallets
  cryptoRate: Float # Omit (or null) to keep the stored rate
  cryptoBonusPercent: Float # 0-50; omit to keep, 0 or null to switch the bonus off
  limits: DepositLimitsInput
}

input BankDetailsInput {
  vipTierIds: [ID!]
  id: String # Optional: for updates, omit for new entries
  accountName: String!
  accountNumber: String!
  ifsc: String!
  bankName: String!
  branch: String!
  notes: String
  minAmount: Float
  maxAmount: Float
  weight: Int
  enabled: Boolean
}

input UpiDetailsInput {
  vipTierIds: [ID!]
  id: String # Optional: for updates, omit for new entries
  upiId: String!
  displayName: String
  qrKey: String
  minAmount: Float
  maxAmount: Float
  weight: Int
  enabled: Boolean
}

input CryptoDetailsInput {
  vipTierIds: [ID!]
  id: String # Optional: for updates, omit for new entries
  network: String!
  walletAddress: String!
  displayName: String
  qrKey: String
  minAmount: Float
  maxAmount: Float
  weight: Int
  enabled: Boolean
}

input DepositLimitsInput {
  min: Float!
  max: Float!
}

# Payloads
type DepositRequestPayload {
  success: Boolean!
  message: String!
  depositRequest: DepositRequest
}

type WhitelabelPaymentMethodsPayload {
  success: Boolean!
  message: String!
  paymentMethods: WhitelabelPaymentMethods
}

type DepositRequestStats {
  totalRequests: Int!
  pending: Int!
  approved: Int!
  rejected: Int!
  totalAmount: Float!
  approvalRate: Int!
  rejectionRate: Int!
}
extend type Query { adminDepositRequestStats: DepositRequestStats! }
