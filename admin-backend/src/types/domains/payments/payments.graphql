# Withdrawals (admin)
enum WithdrawalStatus {
  PENDING
  PROCESSING
  COMPLETED
  FAILED
  CANCELLED
}

input AdminWithdrawalFilter {
  id: ID # One request by its id (task links); combine with no status or dates to find it whatever its age
  status: WithdrawalStatus
  userId: ID
  accountId: ID
  query: String # 2+ characters: the player's name, username, phone or email, or the request id
  fromDate: String
  toDate: String
  offset: Int
  limit: Int
}

type WithdrawalAccount {
  id: ID!
  method: String
  accountNumber: String
  ifscCode: String
  bankName: String
  accountHolderName: String
  deletedAt: String # set when the player deleted the account; the withdrawal still shows it, marked Deleted
}

type WithdrawalUser {
  id: ID!
  name: String
  phone: String
  email: String
}

type AdminWithdrawalRequest {
  id: ID!
  userId: ID!
  amount: Float!
  currency: String
  status: WithdrawalStatus!
  reviewerId: ID
  reviewedAt: String
  note: String
  createdAt: String!
  updatedAt: String!
  account: WithdrawalAccount
  user: WithdrawalUser
  gatewayPayout: WelivepayPayoutStatus # Set once the withdrawal was sent to WeLivePay; it then settles only through the gateway
}

# A WeLivePay IMPS payout of one withdrawal, as last read from the gateway.
type WelivepayPayoutStatus {
  orderId: String!
  status: String! # pending | requested | processing | success | failed | rejected
  amount: Float!
  utr: String
  failureReason: String
  merchantTransactionId: String
  canReject: Boolean! # true only while WeLivePay has not taken the payout (unsent, or refused for project balance)
}

type WithdrawalGatewayConfig {
  tenant: String
  payoutEnabled: Boolean! # payouts switched on and a merchant key saved for the payment whitelabel
}

type AdminWithdrawalRequestList {
  items: [AdminWithdrawalRequest!]!
  total: Int!
}

type WithdrawalHistoryItem {
  status: WithdrawalStatus!
  reviewerId: ID
  reviewedAt: String
  note: String
}

input SetWithdrawalStatusInput {
  id: ID!
  status: WithdrawalStatus!
  note: String
}

type SetWithdrawalStatusResponse {
  success: Boolean!
  message: String
  request: AdminWithdrawalRequest
}

extend type Mutation {
  sendWelivepayPayout(id: ID!): WelivepayPayoutStatus!
  refreshWelivepayPayout(id: ID!): WelivepayPayoutStatus!
  rejectWelivepayPayout(id: ID!, note: String!): WelivepayPayoutStatus!
  setWithdrawalStatus(input: SetWithdrawalStatusInput!): SetWithdrawalStatusResponse!
  approvePayoutAccount(input: ApprovePayoutAccountInput!): PayoutAccountActionResponse!
  rejectPayoutAccount(input: RejectPayoutAccountInput!): PayoutAccountActionResponse!
}

extend type Query {
  withdrawalGatewayConfig: WithdrawalGatewayConfig!
  adminWithdrawalRequests(input: AdminWithdrawalFilter): AdminWithdrawalRequestList!
  adminWithdrawalHistory(id: ID!): [WithdrawalHistoryItem!]!
  adminPayoutAccounts(input: AdminPayoutAccountFilter): AdminPayoutAccountList!
}

# Payout account approvals (user withdrawal accounts)
enum PayoutAccountApprovalStatus {
  PENDING
  APPROVED
  REJECTED
}

type AdminPayoutAccount {
  id: ID!
  userId: ID!
  method: String!
  accountNumber: String!
  ifscCode: String
  bankName: String
  accountHolderName: String!
  approvalStatus: PayoutAccountApprovalStatus!
  rejectionReason: String
  approvedBy: ID
  approvedAt: String
  createdAt: String!
  user: WithdrawalUser
}

type AdminPayoutAccountList {
  items: [AdminPayoutAccount!]!
  total: Int!
}

input AdminPayoutAccountFilter {
  status: PayoutAccountApprovalStatus
  userId: ID
  method: String
  query: String
  fromDate: String
  toDate: String
  offset: Int
  limit: Int
}

input ApprovePayoutAccountInput {
  id: ID!
}

input RejectPayoutAccountInput {
  id: ID!
  reason: String
}

type PayoutAccountActionResponse {
  success: Boolean!
  message: String
  account: AdminPayoutAccount
}

type WithdrawalRequestStats {
  totalRequests: Int!
  pending: Int!
  processing: Int!
  completed: Int!
  failed: Int!
  totalAmount: Float!
  completionRate: Int!
  failureRate: Int!
}
type PayoutAccountStats {
  total: Int!
  pending: Int!
  approved: Int!
  rejected: Int!
  approvalRate: Int!
  rejectionRate: Int!
}
extend type Query {
  adminWithdrawalRequestStats: WithdrawalRequestStats!
  adminPayoutAccountStats: PayoutAccountStats!
}
