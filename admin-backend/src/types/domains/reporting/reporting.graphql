# Agent-specific reporting types
type GGRTrendPoint {
  date: String!
  sportsGGR: Float!
  casinoGGR: Float!
  matkaGGR: Float!
  totalGGR: Float!
}

type DomainBreakdownPoint {
  domain: String!
  ggr: Float!
  percentage: Float!
  totalBets: Int!
  totalStake: Float!
}

type PlayerActivityPoint {
  date: String!
  newPlayers: Int!
  activePlayers: Int!
  totalBets: Int!
  totalDeposits: Float!
}

type TopPlayer {
  playerId: ID!
  playerName: String!
  username: String!
  totalGGR: Float!
  totalBets: Int!
  totalStake: Float!
  totalPayout: Float!
  winRate: Float!
  avgBetSize: Float!
  status: String!
  lastBetAt: String!
}

type TopEvent {
  eventId: ID!
  eventName: String!
  sport: String
  domain: String!
  totalGGR: Float!
  totalBets: Int!
  totalStake: Float!
  totalPayout: Float!
  avgOdds: Float!
  startTime: String!
  status: String!
}

# Reporting Query type for grouping agent-specific reporting queries
type ReportingQuery {
  ggrTrends(agentId: ID!, periodFrom: String!, periodTo: String!): [GGRTrendPoint!]!
  domainBreakdown(agentId: ID!, periodFrom: String!, periodTo: String!): [DomainBreakdownPoint!]!
  playerActivity(agentId: ID!, periodFrom: String!, periodTo: String!): [PlayerActivityPoint!]!
  topPlayers(agentId: ID!, periodFrom: String!, periodTo: String!, limit: Int = 50): [TopPlayer!]!
  topEvents(agentId: ID!, periodFrom: String!, periodTo: String!, domain: String, limit: Int = 50): [TopEvent!]!
}

# Daily reporting snapshot pipeline health (directors / ops)
type SnapshotHealthSummary {
  nextRunAtIso: String!
  snapshotTimezone: String!
  runAtLocalTime: String!
  healthCheckCron: String!
  dailyLookbackDays: Int!
  backfillLookbackDays: Int!
  errorsLast24h: Int!
  """Count of backfill_zero_enqueue_with_gaps warnings in the last 24h (global pipeline signal)."""
  backfillGapWarningsLast24h: Int!
  missingDaysCount: Int!
  lastSchedulePublishAt: String
  lastScheduleFailureAt: String
  lastScheduleFailureMessage: String
  lastJobCompleteAt: String
  lastDailyScheduleRunAt: String
  lastDailyScheduleRunStatus: String
  lastHealthBackfillRunAt: String
  lastHealthBackfillRunStatus: String
}

type SnapshotPageInfo {
  startCursor: String
  endCursor: String
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
}

type SnapshotRunConnection {
  nodes: [SnapshotRun!]!
  pageInfo: SnapshotPageInfo!
}

type SnapshotEventConnection {
  nodes: [SnapshotEvent!]!
  pageInfo: SnapshotPageInfo!
}

type SnapshotPgBossJobCount {
  name: String!
  state: String!
  count: Int!
}

type SnapshotPgBossScheduleRow {
  name: String!
  cron: String
  timezone: String
}

"""Read-only pg-boss rows for reporting snapshot jobs (schema may differ by pg-boss version)."""
type SnapshotPgBossOverview {
  jobCounts: [SnapshotPgBossJobCount!]!
  schedules: [SnapshotPgBossScheduleRow!]!
  readError: String
}

type SnapshotRun {
  id: ID!
  trigger: String!
  status: String!
  startedAt: String!
  finishedAt: String
  summaryJson: JSON
  errorMessage: String
}

type SnapshotEvent {
  id: ID!
  runId: ID
  occurredAt: String!
  level: String!
  eventType: String!
  tenant: String
  whitelabelId: String
  currency: String
  reportingDay: String
  snapshotDateUtc: String
  reportingDayLabel: String
  timezoneNote: String
  domain: String
  pgBossJobId: String
  singletonKey: String
  message: String
  detailJson: JSON
}

type SnapshotMissingDay {
  tenant: String!
  whitelabelId: String!
  currency: String!
  reportingDay: String!
  timezone: String!
}

"""Sports snapshot row is older than at least one settled bet on that reporting day (late result declaration)."""
type SnapshotStaleDay {
  tenant: String!
  whitelabelId: String!
  currency: String!
  reportingDay: String!
  timezone: String!
  staleBetCount: Int!
  snapshotCreatedAt: String!
  latestSettledAt: String!
}

