# Agent Reporting Types
type AgentKPIs {
  totalTurnover: Float!
  totalGGR: Float!
  commissionEarned: Float!
  shareEarned: Float!
  downlineTurnover: Float!
  downlineGGR: Float!
  playerCount: Int!
  activePlayerCount: Int!
  betCount: Int!
  agentCount: Int!
}

type AgentPerformanceDomainBreakdown {
  domain: String!
  turnover: Float!
  ggr: Float!
  cut: Float!
  cutPercent: Float!
  # For "user% − agent% = cut%" display in Sports/Casino/Matka Cut columns
  userCutPercent: Float
  agentCutPercent: Float
}

type AgentPerformance {
  agentId: ID!
  agentName: String
  schemeType: String
  totalTurnover: Float!
  totalGGR: Float!
  commissionEarned: Float!
  shareEarned: Float!
  downlineTurnover: Float!
  downlineGGR: Float!
  playerCount: Int!
  betCount: Int!
  level: Int!
  # Cut formula: userCutPercent - agentCutPercent = cut (%). Shown as e.g. 85% - 10% = 75%
  userCutPercent: Float
  agentCutPercent: Float
  domainBreakdown: [AgentPerformanceDomainBreakdown!]
}

type AgentPerformanceTotals {
  totalTurnover: Float!
  totalGGR: Float!
  commissionEarned: Float!
  shareEarned: Float!
  agentCount: Int!
  playerCount: Int!
  betCount: Int!
}

type AgentPerformanceResult {
  agents: [AgentPerformance!]!
  totals: AgentPerformanceTotals
}

type AgentTrendPoint {
  date: String!
  turnover: Float!
  ggr: Float!
  commission: Float!
  share: Float!
  playerCount: Int!
}

