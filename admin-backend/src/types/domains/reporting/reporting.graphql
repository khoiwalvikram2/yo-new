# Reporting Domain Types

enum ReportingDomain {
  SPORTS
  CASINO
  MATKA
  AGENTS
  BONUSES
  GLOBAL
}

# Sports Reporting Types
type SportsKPIs {
  totalStakes: Float!
  totalPayouts: Float!
  totalExposure: Float!
  grossGamingRevenue: Float!
  netRevenue: Float!
  holdPercentage: Float!
  betCount: Int!
  playerCount: Int!
  activePlayerCount: Int!
}

type SportsTrendPoint {
  date: String!
  stakes: Float!
  payouts: Float!
  ggr: Float!
  betCount: Int!
  playerCount: Int!
}

type SportsBreakdown {
  id: ID
  name: String!
  totalStakes: Float!
  totalPayouts: Float!
  grossGamingRevenue: Float!
  betCount: Int!
  playerCount: Int!
}

type TopSportsEvent {
  eventId: ID
  eventName: String!
  leagueName: String!
  sportName: String!
  totalStakes: Float!
  totalPayouts: Float!
  grossGamingRevenue: Float!
  betCount: Int!
}

