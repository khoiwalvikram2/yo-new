# Matka player API: market state is server-derived; mutations never accept odds.
enum PlayerMatkaKind { WORLI STARLINE JACKPOT SATTA_MATKA }
enum PlayerMatkaSession { OPEN CLOSE }
enum PlayerMatkaWallet { CASH BONUS REFERRAL_BONUS }
type PlayerMatkaSessionState { side: PlayerMatkaSession! enabled: Boolean! accepting: Boolean! resultAt: String! lockAt: String! startsAt: String! status: String! }
type PlayerMatkaRate { bidType: String! label: String! payoutMultiplier: Float! }
type PlayerMatkaResult { date: String! openResult: String closeResult: String openDigit: String closeDigit: String jodi: String complete: Boolean! }
type PlayerMatkaMarket {
  id: ID! code: String! name: String! kind: PlayerMatkaKind! description: String timezone: String!
  runDate: String! status: String! message: String minStake: Float! maxStake: Float! featured: Boolean!
  quoteVersion: String! sessions: [PlayerMatkaSessionState!]! rates: [PlayerMatkaRate!]! result: PlayerMatkaResult!
}
type PlayerMatkaMarketsResponse { meta: ApiMeta! data: [PlayerMatkaMarket!]! }
type PlayerMatkaMarketResponse { meta: ApiMeta! data: PlayerMatkaMarket }
type PlayerMatkaChartResponse { meta: ApiMeta! data: [PlayerMatkaResult!]! }
type PlayerMatkaBet {
  id: ID! batchId: ID marketId: ID! marketName: String! runDate: String! bidType: String! selection: String!
  session: PlayerMatkaSession! amount: Float! payoutMultiplier: Float! potentialWin: Float! actualWin: Float
  netProfit: Float status: String! result: String walletType: String! currency: String! createdAt: String! settledAt: String
}
type PlayerMatkaBetsResponse { meta: ApiMeta! data: [PlayerMatkaBet!]! }
type PlayerMatkaWalletBalance { walletType: PlayerMatkaWallet! label: String! balance: Float! currency: String! }
type PlayerMatkaWalletResponse { meta: ApiMeta! data: [PlayerMatkaWalletBalance!]! canBet: Boolean! message: String }
input PlayerMatkaEntryInput { bidType: String! selection: String! session: PlayerMatkaSession! amount: Float! }
input PlaceMatkaEntriesInput { marketId: ID! runDate: String! requestKey: String! quoteVersion: String accountId: ID walletType: PlayerMatkaWallet! entries: [PlayerMatkaEntryInput!]! }
type PlayerMatkaPlacement { batchId: ID! totalStake: Float! replayed: Boolean! bets: [PlayerMatkaBet!]! }
type PlaceMatkaEntriesResponse { meta: ApiMeta! data: PlayerMatkaPlacement }
extend type Query {
  matkaMarkets(kind: PlayerMatkaKind, search: String, page: Int, limit: Int): PlayerMatkaMarketsResponse!
  matkaMarket(id: ID!): PlayerMatkaMarketResponse!
  matkaChart(marketId: ID!, from: String!, to: String!): PlayerMatkaChartResponse!
  myMatkaBets(marketId: ID, status: String, from: String, to: String, page: Int, limit: Int): PlayerMatkaBetsResponse!
  matkaWallet: PlayerMatkaWalletResponse!
}
extend type Mutation { placeMatkaEntries(input: PlaceMatkaEntriesInput!): PlaceMatkaEntriesResponse! }
