  casinoProviders(category: String, liveOnly: Boolean): CasinoProviderResponse!
  casinoSummary(input: CasinoGamesInput): CasinoSummaryResponse!
  recentCasinoGames(limit: Int): CasinoGameResponse!
  likedCasinoGames(limit: Int): CasinoGameResponse!
  gapCasinoUrl(gameId: ID!): CasinoRedirectResponse!
  casinoUrl(gameId: ID!): CasinoRedirectResponse!
  bonusData: BonusResponse!
  bonusHistory(status: String, fromDate: String, toDate: String): BonusHistoryResponse!
  availableBonusCampaigns: BonusCampaignResponse!
  referralProgram: ReferralProgramResponse!
  activeReferralRules: ReferralRuleResponse!
  referralUsers: ReferralUserResponse!
  referralTransactions: ReferralTxnResponse!
  weeklyReferralSummary(startDate: String!, endDate: String!): ReferralSummaryResponse!
  referralAggregate: ReferralAggregateResponse!
  myReferralLink: MyReferralLinkResponse!
  sportsList: SportsListResponse!
  sportsBookmarks: SportsBookmarksResponse!
  recentSports: SportsBookmarksResponse!
  sportsEventDetail(eventId: ID!): SportsEventDetailResponse!
  vipStatus: VIPResponse!
  vipTiers: VIPTiersResponse!
  userBets(eventId: ID, marketIds: [ID!], openOnly: Boolean): UserBetsResponse!
  sportsSettings(sportId: String!, leagueId: String!, eventId: String!): SportsSettingsResponse!
  myStakeLimits: StakeLimitsResponse!
  """Live TV and Score Card URLs. Only works for grandwinn-com; returns null for kondareddi-com and other tenants."""
